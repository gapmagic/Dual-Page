name = "dualpage"
main = "src/index.js"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "readpal"
database_id = "REPLACE_WITH_D1_ID"

[[kv_namespaces]]
binding = "BOOKS"
id = "REPLACE_WITH_KV_ID"

[[rules]]
type = "Text"
globs = ["**/*.lua"]
fallthrough = true

[triggers]
crons = ["0 20 * * *"] # 03:00 Vietnam time: delete shared book files of finished rooms
