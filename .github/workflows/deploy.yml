name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: ./scripts/deploy.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Smoke test
        run: |
          URL=https://dualpage.online
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/" || true)
            echo "$URL -> $code"; [ "$code" = 200 ] && break; sleep 10
          done
          curl -fsS -X POST "$URL/api/rooms" -H 'content-type: application/json' -d '{"name":"smoke","sprint_days":7,"tz":"UTC"}' | head -c 120
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
